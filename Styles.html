<style>
  :root {
    --brand: #128C7E;
    --brand-dark: #075E54;
    --brand-soft: #E7F6F3;
    --accent: #25D366;
    --bg: #F0F2F5;
    --panel: #FFFFFF;
    --panel-2: #F7F8FA;
    --line: #E4E7EB;
    --line-strong: #C9CFD6;
    --ink: #111B21;
    --muted: #667781;
    --chat-bg: #EFEAE2;
    --in: #FFFFFF;
    --out: #D9FDD3;
    --read: #34B7F1;
    --danger: #D93025;
    --danger-soft: #FCE8E6;
    --warn: #B06000;
    --warn-soft: #FEF7E0;
    --info-soft: #E8F0FE;
    --shadow: 0 1px 2px rgba(17, 27, 33, .12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); text-decoration: none; }
  .spacer { flex: 1; }
  .hide { display: none !important; }
  .muted { color: var(--muted); }
  .sub { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 16px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .full { grid-column: 1 / -1; }
  .lbl { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 12px; }
  .link { color: var(--brand); cursor: pointer; font-weight: 500; }
  .link:hover { text-decoration: underline; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--brand); color: #fff; border: 1px solid transparent; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: transparent; color: var(--brand); border-color: var(--line-strong); }
  .btn.ghost:hover { background: var(--brand-soft); }
  .btn.danger { background: var(--danger); }
  .btn.danger:hover { background: #b3261e; }
  .btn.danger-ghost { background: transparent; color: var(--danger); border-color: #f1b8b3; }
  .btn.danger-ghost:hover { background: var(--danger-soft); }
  .btn.block { display: flex; width: 100%; }
  .btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
  .iconBtn { background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
  .iconBtn:hover { background: var(--panel-2); }

  /* Fields */
  .field { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: var(--panel); outline: none; }
  .field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(18, 140, 126, .15); }
  textarea.field { resize: vertical; }
  .pw-wrap { position: relative; display: flex; }
  .pw-wrap .field { padding-right: 62px; }
  .pw-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--brand); cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; }
  .switch input { accent-color: var(--brand); width: 16px; height: 16px; }

  /* Cards and layout helpers */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-head .sub { margin-top: 2px; }
  .formGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .formGrid .lbl.full { grid-column: 1 / -1; }
  .tableWrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--panel-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; min-width: 160px; }
  tr:last-child td { border-bottom: 0; }
  .cell-user { display: flex; align-items: center; gap: 10px; }
  .cell-user .sub { font-size: 12px; }

  /* Pills, dots, badges */
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip, #EEF0F3); color: var(--muted); text-transform: capitalize; }
  .pill.open, .pill.green, .pill.ok, .pill.completed { background: #E6F4EA; color: #137333; }
  .pill.red, .pill.bad, .pill.missed, .pill.rejected, .pill.Overdue { background: var(--danger-soft); color: var(--danger); }
  .pill.taken, .pill.agent, .pill.ringing { background: var(--brand-soft); color: var(--brand-dark); }
  .pill.admin { background: #EDE7F6; color: #5E35B1; }
  .pill.caller, .pill.in-progress { background: var(--warn-soft); color: var(--warn); }
  .statusPill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .statusPill.open { background: #E6F4EA; color: #137333; border-color: #CFE9D7; }
  .badge { display: inline-block; min-width: 20px; text-align: center; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: #06281F; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #B0B7BF; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 3px rgba(37, 211, 102, .2); }

  /* Avatars */
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; }
  .avatar.sm { width: 30px; height: 30px; font-size: 13px; }
  .avatar.lg { width: 60px; height: 60px; font-size: 24px; }
  .avatar.group { background: #34B7F1; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tab { flex: 1; background: transparent; border: 0; border-radius: 8px; padding: 7px 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
  .tab.on { background: var(--panel); color: var(--brand); font-weight: 600; box-shadow: var(--shadow); }

  /* KPI cards and stats */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .kpi[data-go], .kpi[tabindex] { cursor: pointer; }
  .kpi:hover { border-color: var(--brand); }
  .kpi span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .kpi b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi small { font-size: 12px; color: var(--muted); }
  .kpi.warn { border-color: #F5C78E; background: var(--warn-soft); }
  .kpi.warn b { color: var(--warn); }
  .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv > span:first-child { color: var(--muted); }
  .kv > span:last-child { text-align: right; font-weight: 500; }

  /* Auth (login pages) */
  .auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); }
  .auth-brand { background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%); color: #fff; padding: 56px 48px; display: flex; flex-direction: column; justify-content: center; }
  .auth-logo { width: 52px; height: 52px; border-radius: 14px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; margin-bottom: 22px; }
  .auth-brand h1 { font-size: 30px; margin: 0 0 10px; font-weight: 700; letter-spacing: -.02em; }
  .auth-brand > p { font-size: 15px; opacity: .9; margin: 0 0 26px; max-width: 420px; }
  .auth-points { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .auth-points li { display: flex; align-items: center; gap: 12px; font-size: 14.5px; }
  .auth-points i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; }
  .auth-panel { display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg); }
  .auth-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(17, 27, 33, .08); margin: 0; }
  .auth-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
  .auth-card > p { margin: 0 0 20px; color: var(--muted); }
  .auth-card .btn { margin-top: 4px; height: 42px; }
  .auth-card .err { margin-top: 10px; }
  .auth-foot { margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--muted); }

  /* Modal */
  .modalWrap { position: fixed; inset: 0; background: rgba(11, 20, 26, .5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
  .modalWrap.on { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; padding: 22px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  .modalHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .modalHead h2 { margin: 0; font-size: 18px; font-weight: 600; }

  /* Toast */
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px; display: none; z-index: 120; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }

  /* Shared empty-state and mobile */
  @media (max-width: 800px) {
    .auth { grid-template-columns: 1fr; }
    .auth-brand { padding: 32px 24px; }
    .formGrid { grid-template-columns: 1fr; }
  }
</style>
