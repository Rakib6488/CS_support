<style>
  .screen { display: none; }
  .screen.on { display: grid; }

  /* ---------- Admin shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 252px; flex: none; background: var(--brand-dark); color: #E6F4F1; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 40; }
  .side-brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 12px; }
  .side-brand .logo { width: 38px; height: 38px; border-radius: 11px; background: rgba(255, 255, 255, .16); display: grid; place-items: center; flex: none; }
  .side-brand b { display: block; font-size: 15px; font-weight: 700; color: #fff; }
  .side-brand span { font-size: 12px; opacity: .72; }
  #nav { flex: 1; overflow-y: auto; padding: 4px 10px 14px; }
  .nav-group { margin-top: 16px; }
  .nav-group h6 { margin: 0 10px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border: 0; background: none; color: inherit; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 500; font-size: 14px; }
  .nav-item:hover { background: rgba(255, 255, 255, .08); }
  .nav-item.on { background: rgba(255, 255, 255, .17); color: #fff; }
  .nav-item svg { width: 18px; height: 18px; flex: none; opacity: .92; }
  .navBadge { margin-left: auto; background: var(--accent); color: #06281F; font-weight: 700; font-size: 11.5px; border-radius: 999px; padding: 0 7px; display: none; }
  .side-foot { border-top: 1px solid rgba(255, 255, 255, .14); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .side-foot .avatar { background: rgba(255, 255, 255, .18); color: #fff; }
  .side-foot .who { flex: 1; min-width: 0; }
  .side-foot .who b { display: block; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-foot .who span { font-size: 12px; opacity: .72; }
  .side-foot .iconBtn { border-color: rgba(255, 255, 255, .32); color: #fff; }
  .side-foot .iconBtn:hover { background: rgba(255, 255, 255, .1); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  #menuToggle { display: none; }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; min-width: 0; }
  .crumbs .link { color: var(--muted); font-weight: 500; }
  .crumbs .sep { color: var(--line-strong); }
  .filterbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .filterbar .field { width: auto; min-width: 140px; }
  #customDates { display: none; gap: 12px; }
  #customDates.on { display: flex; }
  .rangeNote { padding: 8px 24px 0; color: var(--muted); font-size: 12.5px; }
  .content { padding: 20px 24px 56px; width: 100%; max-width: 1380px; }
  .pagehead { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .pagehead h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .pagehead p { margin: 3px 0 0; color: var(--muted); max-width: 720px; }
  .pagehead .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid2 > .card, .grid-main > .card { margin: 0; }
  .grid-main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 14px; margin-bottom: 14px; align-items: start; }
  .chartBox { position: relative; height: 270px; }
  .card h3 { font-size: 15px; }
  .card .sub { margin: 2px 0 12px; }
  .stack > * + * { margin-top: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .toolbar .field { width: auto; min-width: 130px; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .errbox { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 14px 16px; }
  .profile { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .profile h2 { font-size: 20px; }
  .profile .meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .linkRow { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .linkRow:last-child { border-bottom: 0; }
  .linkLine { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .linkLine .field { flex: 1; min-width: 240px; }
  dl.defs { margin: 0; display: grid; grid-template-columns: 210px 1fr; gap: 10px 18px; font-size: 13.5px; }
  dl.defs dt { font-weight: 600; }
  dl.defs dd { margin: 0; color: var(--muted); line-height: 1.5; }
  .radio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; margin-bottom: 8px; }
  .radio input { margin-top: 3px; accent-color: var(--brand); }
  .radio b { display: block; font-weight: 600; }
  .radio span { color: var(--muted); font-size: 12.5px; }
  .cred { background: var(--panel-2); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .cred div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .cred code { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }

  /* transcript (read-only chat view) */
  .transcript { background: var(--chat-bg); border-radius: 10px; padding: 14px; max-height: 68vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .dayChip { align-self: center; background: var(--panel); color: var(--muted); font-size: 12px; padding: 3px 11px; border-radius: 8px; margin: 8px 0 4px; }
  .bubble { max-width: 78%; padding: 7px 11px 6px; border-radius: 10px; background: var(--in); box-shadow: 0 1px 1px rgba(17, 27, 33, .12); overflow-wrap: anywhere; align-self: flex-start; border-top-left-radius: 2px; }
  .bubble.out { align-self: flex-end; background: var(--out); border-top-left-radius: 10px; border-top-right-radius: 2px; }
  .bubble .who { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  .bubble .text { white-space: pre-wrap; }
  .bubble .text.deleted { font-style: italic; color: var(--muted); }
  .bubble .quote { border-left: 3px solid var(--brand); background: rgba(127, 127, 127, .14); padding: 3px 8px; border-radius: 4px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .bubble .media { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .bubble .meta { text-align: right; font-size: 11px; color: var(--muted); margin-top: 3px; }

  @media (max-width: 1000px) {
    .sidebar { position: fixed; left: -270px; transition: left .2s; }
    .sidebar.open { left: 0; box-shadow: 10px 0 30px rgba(0, 0, 0, .3); }
    #menuToggle { display: inline-flex; }
    .content, .topbar, .filterbar { padding-left: 14px; padding-right: 14px; }
    .grid2, .grid-main { grid-template-columns: 1fr; }
    dl.defs { grid-template-columns: 1fr; }
    .pagehead { flex-wrap: wrap; }
  }
</style>
</head>

<script>
  /* ==========================================================================
     State
     ========================================================================== */
  const URL_TOKEN = <?= JSON.stringify(token) ?> || new URLSearchParams(window.location.hash.slice(1)).get('token') || '';
  let TOKEN = '', DATA = null, dataPromise = null, TEAM = null;
  let view = { id: 'overview', arg: '' }, renderSeq = 0, editing = null;
  const charts = {};
  const $ = (id) => document.getElementById(id);

  function run(fn, ...args) {
    return new Promise((res, rej) => {
      const r = google.script.run
        .withSuccessHandler(res)
        .withFailureHandler((e) => {
          const m = (e && e.message) || String(e);
          if (m.indexOf('SESSION_EXPIRED') >= 0) logout('Your session expired. Please sign in again.');
          rej(new Error(m.replace(/^Error:\s*/, '')));
        });
      r[fn](...args);
    });
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  /* ---------- Formatting ---------- */
  function fmtDur(sec) {
    if (sec == null) return '-';
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
    return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
  }
  function fmtMin(min) {
    if (min < 60) return min + ' min';
    if (min < 1440) return Math.floor(min / 60) + 'h ' + (min % 60) + 'm';
    return Math.floor(min / 1440) + 'd ' + Math.floor((min % 1440) / 60) + 'h';
  }
  function fmtDT(ms) { return ms ? new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-'; }
  function fmtDate(ms) { return new Date(ms).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }); }
  function ymd(d) {
    const m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function pct(v) { return v == null ? '-' : v + '%'; }
  const ROLE_LABEL = { admin: 'Admin', agent: 'Agent', caller: 'Call agent' };

  /* ---------- Icons (drawn with SVG paths, no external files) ---------- */
  const ICONS = {
    home: ['M3 11l9-8 9 8', 'M5 10v10h14V10'],
    users: ['M9 11a3 3 0 100-6 3 3 0 000 6z', 'M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6', 'M16 5.2a3 3 0 010 5.6', 'M18 14.2c2 .7 3 2.6 3 5.8'],
    chart: ['M4 20V4', 'M4 20h16', 'M8 16v-5', 'M12 16V8', 'M16 16v-3'],
    chat: ['M4 5h16v11H9l-5 4z'],
    alert: ['M12 3l10 18H2z', 'M12 10v5', 'M12 18h.01'],
    calendar: ['M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z', 'M3 10h18', 'M8 3v4', 'M16 3v4'],
    phone: ['M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z'],
    bolt: ['M13 2L4 14h7l-1 8 9-12h-7z'],
    sliders: ['M4 7h16', 'M4 17h16', 'M9 7m-2 0a2 2 0 104 0 2 2 0 10-4 0', 'M15 17m-2 0a2 2 0 104 0 2 2 0 10-4 0'],
    link: ['M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1', 'M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1'],
    download: ['M12 3v12', 'M7 10l5 5 5-5', 'M4 21h16'],
    book: ['M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z', 'M8 7h7'],
    tag: ['M3 12V4h8l10 10-8 8z', 'M7.5 8.5h.01'],
  };
  function icon(name) {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '1.8');
    s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round');
    (ICONS[name] || []).forEach((d) => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      s.appendChild(p);
    });
    return s;
  }

  /* ==========================================================================
     Single-page authentication and sign out
     ========================================================================== */
  function logout(msg) {
    if (TOKEN) google.script.run.signOut(TOKEN);
    TOKEN = ''; DATA = null; dataPromise = null; TEAM = null;
    clearInterval(refreshBridge.timer); refreshBridge.timer = null;
    destroyCharts();
    $('app').classList.add('hide');
    $('agentModal').classList.remove('on');
    window.location.href = window.location.href.split('?')[0];
  }
  $('logout').addEventListener('click', () => logout('You have been signed out.'));

  if (!URL_TOKEN) {
    window.location.href = window.location.href.split('?')[0];
  } else {
    TOKEN = URL_TOKEN;
    run('getSettings', TOKEN).then(() => {
      $('meName').textContent = 'Administrator';
      $('meInitial').textContent = 'A';
      $('app').classList.remove('hide');
      buildNav();
      go('overview');
      ensureData().catch(() => {});
      refreshBridge();
      if (!refreshBridge.timer) refreshBridge.timer = setInterval(refreshBridge, 60000);
    }).catch(() => logout());
  }

  function refreshBridge() {
    if (!TOKEN) return;
    run('getSettings', TOKEN).then((s) => {
      const ok = s.bridge.status === 'ready';
      const p = $('bridgePill');
      p.textContent = ok ? 'WhatsApp connected' : 'WhatsApp not connected';
      p.className = 'pill ' + (ok ? 'green' : 'red');
    }).catch(() => {});
  }

  /* ==========================================================================
     Navigation
     ========================================================================== */
  const NAV = [
    { group: 'Overview', items: [{ id: 'overview', label: 'Dashboard', icon: 'home' }] },
    { group: 'People', items: [{ id: 'team', label: 'Team', icon: 'users' }, { id: 'agents', label: 'Agent performance', icon: 'chart' }] },
    { group: 'Conversations', items: [{ id: 'chats', label: 'Chats', icon: 'chat' }, { id: 'pending', label: 'Pending', icon: 'alert', badge: true }, { id: 'days', label: 'Date and time', icon: 'calendar' }, { id: 'tags', label: 'Service tags', icon: 'tag' }] },
    { group: 'Calls', items: [{ id: 'calls', label: 'Calls', icon: 'phone' }] },
    { group: 'Manage', items: [{ id: 'quick', label: 'Quick replies', icon: 'bolt' }, { id: 'settings', label: 'Settings', icon: 'sliders' }, { id: 'links', label: 'Portal links', icon: 'link' }] },
    { group: 'Data', items: [{ id: 'export', label: 'Export CSV', icon: 'download' }, { id: 'guide', label: 'Guide', icon: 'book' }] },
  ];
  // title, whether the filter bar shows, which menu item stays highlighted, and the parent page of a detail page
  const META = {
    overview: { title: 'Dashboard', filters: true, nav: 'overview' },
    team: { title: 'Team', nav: 'team' },
    agents: { title: 'Agent performance', filters: true, nav: 'agents' },
    agent: { title: 'Agent', filters: true, nav: 'team', parent: 'team' },
    chats: { title: 'Chats', filters: true, nav: 'chats' },
    chat: { title: 'Chat', nav: 'chats', parent: 'chats' },
    pending: { title: 'Pending chats', filters: true, nav: 'pending' },
    days: { title: 'Date and time', filters: true, nav: 'days' },
    tags: { title: 'Service tags', filters: true, nav: 'tags' },
    calls: { title: 'Calls', nav: 'calls' },
    quick: { title: 'Quick replies', nav: 'quick' },
    settings: { title: 'Settings', nav: 'settings' },
    links: { title: 'Portal links', nav: 'links' },
    export: { title: 'Export CSV', filters: true, nav: 'export' },
    guide: { title: 'Guide', nav: 'guide' },
  };

  // page functions are declared below (function declarations are available from the start)
  const PAGES = { overview: pageOverview, team: pageTeam, agents: pageAgents, agent: pageAgent, chats: pageChats, chat: pageChat, pending: pagePending, days: pageDays, tags: pageTags, calls: pageCalls, quick: pageQuick, settings: pageSettings, links: pageLinks, export: pageExport, guide: pageGuide };

  function buildNav() {
    const nav = $('nav');
    nav.innerHTML = '';
    NAV.forEach((g) => {
      const box = el('div', 'nav-group');
      box.appendChild(el('h6', '', g.group));
      g.items.forEach((it) => {
        const b = el('button', 'nav-item');
        b.type = 'button';
        b.dataset.id = it.id;
        b.appendChild(icon(it.icon));
        b.appendChild(el('span', '', it.label));
        if (it.badge) { const n = el('span', 'navBadge'); n.id = 'navPending'; b.appendChild(n); }
        b.addEventListener('click', () => go(it.id));
        box.appendChild(b);
      });
      nav.appendChild(box);
    });
  }

  function go(id, arg) {
    view = { id: id, arg: arg || '' };
    $('sidebar').classList.remove('open');
    renderView();
    window.scrollTo(0, 0);
  }
  $('menuToggle').addEventListener('click', () => $('sidebar').classList.toggle('open'));
  $('refresh').addEventListener('click', () => { DATA = null; dataPromise = null; TEAM = null; refreshBridge(); renderView(); });

  function setCrumbs(parts) {
    const box = $('crumbs');
    box.innerHTML = '';
    parts.forEach((p, i) => {
      if (i) box.appendChild(el('span', 'sep', '/'));
      if (p.go) {
        const a = el('a', 'link', p.label);
        a.addEventListener('click', () => go(p.go));
        box.appendChild(a);
      } else {
        box.appendChild(el('span', '', p.label));
      }
    });
  }
  function setLastCrumb(text) {
    const box = $('crumbs');
    if (box.lastChild) box.lastChild.textContent = text;
  }

  function renderView() {
    const m = META[view.id];
    document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('on', b.dataset.id === m.nav));
    $('filterbar').classList.toggle('hide', !m.filters);

  /* ==========================================================================
     Building blocks
     ========================================================================== */
  function head(v, title, sub, actions) {
    const h = el('div', 'pagehead');
    const t = el('div');
    t.appendChild(el('h1', '', title));
    if (sub) t.appendChild(el('p', '', sub));
    h.appendChild(t);
    if (actions && actions.length) {
      const a = el('div', 'actions');
      actions.forEach((x) => a.appendChild(x));
      h.appendChild(a);
    }
    v.appendChild(h);
  }
  function button(label, cls, fn) {
    const b = el('button', cls || 'btn', label);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }
  function linkEl(text, fn) {
    const a = el('a', 'link', text);
    a.addEventListener('click', fn);
    return a;
  }
  function loading(text) { return el('div', 'loading', text || 'Loading...'); }
  function failed(box, err) { box.innerHTML = ''; box.appendChild(el('div', 'errbox', 'Could not load this page: ' + err.message)); }
  function cardOf(title, sub, extra) {
    const c = el('div', 'card');
    if (title) {
      const h = el('div', 'card-head');
      const t = el('div');
      t.appendChild(el('h3', '', title));
      if (sub) t.appendChild(el('div', 'sub', sub));
      h.appendChild(t);
      if (extra) { h.appendChild(el('span', 'spacer')); h.appendChild(extra); }
      c.appendChild(h);
    }
    return c;
  }
  function kpi(label, value, hint, o) {
    o = o || {};
    const k = el('div', 'kpi' + (o.warn ? ' warn' : ''));
    k.appendChild(el('span', '', label));
    k.appendChild(el('b', '', value));
    k.appendChild(el('small', '', hint));
    if (o.go) {
      k.dataset.go = o.go[0];
      k.tabIndex = 0;
      k.addEventListener('click', () => go(o.go[0], o.go[1]));
      k.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(o.go[0], o.go[1]); });
    }
    return k;
  }
  function statBox(label, value) {
    const d = el('div', 'stat');
    d.appendChild(el('b', '', value));
    d.appendChild(el('span', '', label));
    return d;
  }
  function table(headers, rows) {
    const wrap = el('div', 'tableWrap');
    const t = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    headers.forEach((h) => hr.appendChild(el('th', h[1] ? 'num' : '', h[0])));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = document.createElement('tbody');
    rows.forEach((r) => {
      const tr = document.createElement('tr');
      r.forEach((c, i) => {
        const td = el('td', (headers[i][1] ? 'num ' : '') + (headers[i][2] || ''));
        if (c && c.nodeType) td.appendChild(c);
        else if (c && typeof c === 'object' && c.pill) td.appendChild(el('span', 'pill ' + (c.cls || c.pill), c.pill));
        else td.textContent = c == null ? '' : c;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
    return wrap;
  }
  function pillEl(text, cls) { return el('span', 'pill ' + (cls || ''), text); }
  function person(name, sub, go, group) {
    const w = el('div', 'cell-user');
    w.appendChild(el('div', 'avatar sm' + (group ? ' group' : ''), (name || '?').trim().charAt(0)));

  /* ---------- Charts (Chart.js) ---------- */
  function destroyCharts() { Object.keys(charts).forEach((k) => { charts[k].destroy(); delete charts[k]; }); }
  function canChart() { return typeof Chart !== 'undefined'; }
  function chartCard(title, sub, id) {
    const c = cardOf(title, sub);
    if (!canChart()) { c.appendChild(el('div', 'errbox', 'The chart library did not load. Check your internet connection.')); return c; }
    const box = el('div', 'chartBox');
    const cv = document.createElement('canvas');
    cv.id = id;
    box.appendChild(cv);
    c.appendChild(box);
    return c;
  }
  function mk(id, cfg) {
    if (!canChart() || !$(id)) return;
    Chart.defaults.color = css('--muted');
    Chart.defaults.borderColor = css('--line');
    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    charts[id] = new Chart($(id).getContext('2d'), cfg);
  }
  function palette() { return [css('--brand'), css('--brand-dark'), '#34B7F1', '#E0A100', '#8E5BD0', '#E8590C', '#25D366', '#6B7C85']; }
  function axisOpts(xTitle, yTitle, extra) {
    const o = {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' } },
      scales: { x: { title: { display: !!xTitle, text: xTitle } }, y: { beginAtZero: true, title: { display: !!yTitle, text: yTitle } } },
    };
    if (extra && extra.stacked) { o.scales.x.stacked = true; o.scales.y.stacked = true; }
    if (extra && extra.horizontal) {
      o.indexAxis = 'y';
      o.scales = { x: { beginAtZero: true, title: { display: !!yTitle, text: yTitle } }, y: { title: { display: !!xTitle, text: xTitle } } };
      o.plugins.legend = { display: false };
    }
    return o;
  }
  function doughnutOpts() {
    return {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { callbacks: { label: (c) => { const tot = c.dataset.data.reduce((a, b) => a + b, 0); return c.label + ': ' + c.parsed + ' (' + (tot ? Math.round(c.parsed * 100 / tot) : 0) + '%)'; } } },
      },
    };
  }

  /* ---------- One chat (read-only transcript + management) ---------- */
  function transcriptBubble(m, isGroup) {
    const out = m.dir === 'out';
    const b = el('div', 'bubble' + (out ? ' out' : ''));
    if (out) b.appendChild(el('div', 'who', m.agentName || 'Phone'));
    else if (isGroup && m.sender) b.appendChild(el('div', 'who', m.sender));
    if (m.quoted) b.appendChild(el('div', 'quote', m.quoted));
    if (m.mtype) b.appendChild(el('div', 'media', '[' + (m.mtype.indexOf('image/') === 0 ? 'Photo' : m.mtype.indexOf('video/') === 0 ? 'Video' : m.mtype.indexOf('audio/') === 0 ? 'Audio' : 'File') + (m.mname && m.mname.indexOf('media save failed') !== 0 ? ': ' + m.mname : '') + ']'));
    if (m.body) b.appendChild(el('div', 'text' + (m.body === 'This message was deleted' ? ' deleted' : ''), m.body));
    b.appendChild(el('div', 'meta', new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })));
    return b;
  }

          const a = el('div', 'row');
          a.appendChild(button('Edit', 'btn ghost small', () => { sc.value = x.shortcut; tx.value = x.text; sc.focus(); }));
          a.appendChild(button('Delete', 'btn danger-ghost small', () => { if (confirm('Delete /' + x.shortcut + '?')) run('deleteQuickReply', TOKEN, x.shortcut).then(draw).catch((e) => toast(e.message)); }));
          return ['/' + x.shortcut, x.text, a];
        })) : emptyCard('No quick replies yet. Add the first one on the right.'));
      }).catch((e) => { if (alive()) failed(holder, e); });
    }
    draw();
  }

  /* ---------- Settings ---------- */
  function pageSettings(v, arg, alive) {
    head(v, 'Settings', 'Service targets, how agents appear to customers, and the WhatsApp connection.');
    const body = el('div'); body.appendChild(loading()); v.appendChild(body);
    run('getSettings', TOKEN).then((s) => {
      if (!alive()) return;
      body.innerHTML = '';
      const row = el('div', 'grid2');

      const c1 = cardOf('Service and messages', 'These apply to everyone.');
      const st = el('div', 'stack');
      const l1 = el('label', 'lbl', 'SLA target: reply within (minutes)'); const sla = el('input', 'field'); sla.type = 'number'; sla.min = 1; sla.max = 1440; sla.value = s.slaMinutes; l1.appendChild(sla);
      l1.appendChild(el('span', 'hint', 'Used for the "within target" and "overdue" numbers in reports.'));
      st.appendChild(l1);
      const gl = el('div'); gl.appendChild(el('div', 'lbl', 'Show the agent name in WhatsApp messages'));
      const modes = [['groups', 'Group chats only', 'Customers in groups see who replied, for example *Rakib:*. Recommended.'], ['all', 'Every chat', 'The agent name is added to all messages, including private chats.'], ['off', 'Never', 'Messages are sent exactly as typed.']];
      modes.forEach((m) => {
        const r = el('label', 'radio'); const i = document.createElement('input'); i.type = 'radio'; i.name = 'signMode'; i.value = m[0]; i.checked = s.signMode === m[0];
        const t = el('div'); t.appendChild(el('b', '', m[1])); t.appendChild(el('span', '', m[2]));
        r.appendChild(i); r.appendChild(t); gl.appendChild(r);
      });
      st.appendChild(gl);
      const l3 = el('label', 'lbl', 'Email for "bridge is down" alerts'); const em = el('input', 'field'); em.type = 'email'; em.value = s.alertEmail; em.placeholder = s.ownerEmail || 'owner email'; l3.appendChild(em);
      l3.appendChild(el('span', 'hint', 'Leave empty to use the script owner\'s email.' + (s.alertState === 'down' ? ' The bridge is currently reported as down.' : '')));
      st.appendChild(l3);
      const err = el('div', 'err');
      st.appendChild(button('Save settings', 'btn', () => {
        err.textContent = '';
        const mode = (document.querySelector('input[name="signMode"]:checked') || {}).value;
        run('saveSettings', TOKEN, { slaMinutes: sla.value, signMode: mode, alertEmail: em.value }).then(() => { toast('Settings saved.'); DATA = null; }).catch((e) => { err.textContent = e.message; });
      }));
      st.appendChild(err);
      c1.appendChild(st);
      row.appendChild(c1);

      const c2 = cardOf('WhatsApp connection', 'The bridge keeps this PC or server linked to WhatsApp.');
      const ok = s.bridge.status === 'ready';
      const kv = (k, val) => { const r = el('div', 'kv'); r.appendChild(el('span', '', k)); const x = el('span'); if (val && val.nodeType) x.appendChild(val); else x.textContent = val; r.appendChild(x); return r; };
      c2.appendChild(kv('Status', pillEl(ok ? 'Connected' : 'Not connected (' + s.bridge.status + ')', ok ? 'green' : 'red')));
      c2.appendChild(kv('Last signal from the bridge', s.bridge.ageSec == null ? 'Never' : (s.bridge.ageSec < 120 ? s.bridge.ageSec + ' seconds ago' : Math.round(s.bridge.ageSec / 60) + ' minutes ago')));
      c2.appendChild(kv('Bridge address (BRIDGE_URL)', s.bridgeUrlSet ? 'Set' : 'Missing, set it in Script properties'));
      const un = el('div', 'row'); un.style.marginTop = '14px';
      un.appendChild(button('Unlink WhatsApp', 'btn danger-ghost', () => {
        if (!confirm('Unlink WhatsApp from this workspace? Nobody can send or receive until someone scans a new QR code in the inbox.')) return;
        run('logoutWhatsApp', TOKEN).then(() => { toast('WhatsApp was unlinked. Scan a new QR code in the inbox.'); refreshBridge(); }).catch((e) => toast(e.message));
      }));
      c2.appendChild(un);
      c2.appendChild(el('p', 'hint', 'Email alerts need a one-time setup: run installBridgeMonitor once in the Apps Script editor.'));
      row.appendChild(c2);
      body.appendChild(row);
    }).catch((err) => { if (alive()) failed(body, err); });
  }

  /* ---------- Portal links ---------- */
  function copyField(inp, btn) {
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); };
    inp.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inp.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = 'Press Ctrl+C'; } });
        return;
      }
    } catch (e) { /* fall through */ }
    try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = 'Press Ctrl+C'; }
  }
  function pageLinks(v, arg, alive) {
    head(v, 'Portal links', 'Open or copy the link for the agent or admin portal.');
    const body = el('div'); body.appendChild(loading()); v.appendChild(body);
    run('getPortalLinks', TOKEN).then((l) => {
      if (!alive()) return;
      body.innerHTML = '';
      const c = el('div', 'card');
      [['Agent portal', 'For agents who answer WhatsApp messages.', l.chat], ['Admin portal', 'For administrators only.', l.admin]].forEach((x) => {
        const r = el('div', 'linkRow');
        r.appendChild(el('h3', '', x[0]));
        r.appendChild(el('div', 'sub', x[1]));
        const line = el('div', 'linkLine');
        const inp = el('input', 'field'); inp.readOnly = true; inp.value = x[2];
        const open = el('a', 'btn small', 'Open'); open.href = x[2]; open.target = '_blank'; open.rel = 'noopener';
        const copy = button('Copy', 'btn ghost small', () => copyField(inp, copy));
        line.appendChild(inp); line.appendChild(open); line.appendChild(copy);
        r.appendChild(line);
        c.appendChild(r);
      });
      body.appendChild(c);
    }).catch((err) => { if (alive()) failed(body, err); });
  }

  /* ---------- Export ---------- */
  const EXP = {
    daily: ['Date-wise summary', 'For each day: messages received, customers, agent and phone replies, chats replied to.'],
    agent: ['Agent-wise summary', 'For each agent: replies, chats replied to, average first response (seconds), SLA percentage and last reply.'],
    agentday: ['Agent by date', 'Replies per agent per day.'],
    hour: ['Hour-wise summary', 'For each of the 24 hours: messages received and replies sent.'],
    chat: ['Chat-wise summary', 'For each chat: messages received, replies, status, who replied last.'],
    pending: ['Pending chats', 'Chats still waiting for a reply, how long, and whether they are over the SLA target.'],
    messages: ['All messages (raw data)', 'Every message with time, chat, direction, agent, text, media and delivery status. Large exports can take a while.'],
  };
  function downloadCsv(parts, name) {
    const blob = new Blob(['\uFEFF'].concat(parts), { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function pageExport(v, arg, alive) {
    head(v, 'Export CSV', 'Download reports for Excel. The date range, chat type and SLA target in the bar above are applied.');
    const c = cardOf('Choose a report');
    const fs = el('div', 'stack');
    const l1 = el('label', 'lbl', 'Report'); const kind = el('select', 'field'); Object.keys(EXP).forEach((k) => kind.appendChild(new Option(EXP[k][0], k))); l1.appendChild(kind);
    const l2 = el('label', 'lbl', 'Agent (optional)'); const ag = el('select', 'field'); ag.appendChild(new Option('All agents', '')); l2.appendChild(ag);
    l2.appendChild(el('span', 'hint', 'Applies to the agent summary, agent by date and raw messages.'));
    const desc = el('p', 'sub'); const msg = el('span', 'sub');
    const upd = () => { desc.textContent = EXP[kind.value][1] + ' To stop Excel from running formulas, text starting with =, +, - or @ gets a leading apostrophe.'; };
    kind.addEventListener('change', upd); upd();
    const go1 = button('Download CSV', 'btn', async () => {
      go1.disabled = true; msg.textContent = 'Preparing...';
      try {
        const f = getFilter(); if (ag.value) f.agent = ag.value;
        const parts = []; let page = 0, rows = 0;
        for (;;) {
          const r = await run('exportCsv', TOKEN, kind.value, f, page);
          parts.push(r.csv); rows += r.rows || 0;
          if (kind.value === 'messages') msg.textContent = rows + ' rows so far (page ' + (page + 1) + ')...';
          if (r.done) break;
          page++;
        }
        const stamp = f.range === 'custom' ? f.fromDate + '_to_' + f.toDate : f.range + '_' + ymd(new Date());
        downloadCsv(parts, 'whatsapp_' + kind.value + '_' + stamp + '.csv');
        msg.textContent = 'Download complete (' + rows + ' rows).';
      } catch (e) { msg.textContent = 'Error: ' + e.message; }
      go1.disabled = false;
    });
    [l1, l2, desc].forEach((x) => fs.appendChild(x));
    const r = el('div', 'row'); r.appendChild(go1); r.appendChild(msg); fs.appendChild(r);
    c.appendChild(fs); v.appendChild(c);
    loadTeam().then((l) => l.filter((a) => a.role !== 'caller').forEach((a) => ag.appendChild(new Option(a.name, a.username)))).catch(() => {});
  }

  /* ---------- Guide ---------- */
  function pageGuide(v) {
    head(v, 'Guide', 'Where to find things, and what the numbers mean.');
    const dl = (pairs) => { const d = el('dl', 'defs'); pairs.forEach((p) => { d.appendChild(el('dt', '', p[0])); d.appendChild(el('dd', '', p[1])); }); return d; };
    const a = cardOf('Pages'); a.appendChild(dl([
      ['Dashboard', 'The main numbers for the selected period. Click any number to open the page behind it.'],
      ['Team', 'Create and edit accounts, set roles, see who is online and how busy each person is. Click a name for that agent\'s profile.'],
      ['Agent performance', 'Replies, response speed and SLA for every agent.'],
      ['Chats', 'Every conversation with its handler. Click a chat to read it, reassign it or close it.'],
      ['Pending', 'Customers still waiting for a reply, longest first.'],
      ['Service tags', 'Which services agents gave in each WhatsApp reply.'],
      ['Calls', 'Call history with filters, the agent who handled each call and a CSV download.'],
      ['Settings', 'SLA target, whether the agent name is added to messages, alert email and the WhatsApp connection.'],
    ])); v.appendChild(a);
    const b = cardOf('What the numbers mean'); b.appendChild(dl([
      ['Messages received', 'Messages from individual numbers and groups. Channels, broadcasts and WhatsApp system notices are not counted.'],
      ['Messages answered', 'A customer message counts as answered once any reply (from an agent or the phone) is sent after it. One reply answers every message that came before it.'],
      ['Unanswered / Pending', 'Messages and chats that have not received a reply yet.'],
      ['Customers', 'How many different people or groups wrote in during the period.'],
      ['Avg first response', 'Average time between the first unanswered customer message and the reply.'],
      ['Within SLA target', 'Share of first replies sent inside the target set in the filter bar (every reply counts, from agents and from the phone).'],
      ['Overdue chats', 'Pending chats that have waited longer than the SLA target.'],
      ['Assignment', 'Private chats go to a signed-in agent automatically and only that agent sees them. Group chats are shared with everyone. Admins see everything.'],
      ['Time', 'All times use the timezone of the Apps Script project.'],
    ])); b.style.marginTop = '14px'; v.appendChild(b);
  }

</script>
